<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Organizer</title>
    <link rel="stylesheet" href="organizer.css">
</head>
<body>
    <div id="signup-container">
        <h2>Sign Up</h2>
        <form id="signup-form">
            <input type="text" id="signup-username" placeholder="Username" required>
            <input type="password" id="signup-password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="#" id="show-login">Login here</a></p>
    </div>

    <div id="login-container">
        <h2>Login</h2>
        <form id="login-form">
            <input type="text" id="login-username" placeholder="Username" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p><a href="#" id="forgot-password">Forgot Password?</a></p>
        <p>Don't have an account? <a href="#" id="show-signup">Sign up here</a></p>
    </div>

    <div id="forgot-password-container" style="display: none;">
        <h2>Forgot Password</h2>
        <form id="forgot-password-form">
            <input type="password" id="forgot-password-new" placeholder="Enter new password" required>
            <button type="submit">Reset Password</button>
        </form>
        <p><a href="#" id="show-login-from-forgot">Back to Login</a></p>
    </div>

    <div id="bill-manager-container" style="display: none;">
        <h2>Welcome to Bill Manager</h2>
        <button id="logout-btn">Logout</button>
        <button id="theme-btn">Toggle Dark Mode</button>
        <button id="download-btn">Download Bills</button>

        <div>
            <h3>Add New Bill</h3>
            <form id="bill-form">
                <input type="text" id="bill-name" placeholder="Bill Name" required>
                <input type="number" id="bill-amount" placeholder="Amount" required>
                <select id="bill-category">
                    <option value="Utilities">Utilities</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
                <label for="recurring-bill">Recurring: </label>
                <input type="checkbox" id="recurring-bill">
                <button type="submit">Add Bill</button>
            </form>
		<div class="currency-container">
    <label for="currency-select">Select Currency:</label>
    <select id="currency-select">
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
        <option value="GBP">GBP</option>
	<option value="NGN">NGN</option>
        <!-- Add more currency options as needed -->
    </select>
</div>

            <div>
                <h3>Bills</h3>
                <input type="text" id="search-bill" placeholder="Search Bills">
                <select id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
                <ul id="bill-list"></ul>
                <p id="total-amount">Total: $0.00</p>
                <button id="clear-bills">Clear All Bills</button>
            </div>
        </div>
    </div>

    <script src="organizer.js"></script>
</body>
</html>
